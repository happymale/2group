name: CI

# 템플릿 자체 테스트. 파생 저장소에서는 bootstrap이 이 파일을 제거한다.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install heven-common contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - name: Requirements behavior tests
        run: uv run --python 3.11 --no-project --with strictdoc==0.30.4 python -m unittest discover -s tests -p test_requirements.py
      - name: Verify heven-common template contract
        run: |
          tests/test_template.sh
          .claude/skills/bootstrap-repo/tests/test_bootstrap_repo.sh
          .claude/skills/bootstrap-repo/tests/test_prepare_derived.sh
          .claude/skills/issue-worker/tests/test_claim_issue.sh
          ops/runner/tests/test_codex_pr_review.sh
          ops/runner/tests/test_pr_set_in_review.sh
